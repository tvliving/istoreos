name: 🍞 iStoreOS Philips HY3000 Build 24.10.8

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '额外固件包（空格分隔，默认已含 luci + iStore + WiFi 全套驱动）'
        required: false
        default: 'luci luci-compat luci-i18n-base-zh-cn luci-app-store kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-basic-mbedtls wireless-regdb iwinfo'
      make_release:
        description: '是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: istoreos-hy3000-2410-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVICE: philips_hy3000
  # 编译目标版本：iStoreOS 24.10.8（上游 istoreos/istoreos 的 24.10 源码分支）
  SRC_REPO: istoreos/istoreos
  SRC_REF: istoreos-24.10
  VERSION: 24.10.8

jobs:
  # ============================================================
  # Job 1：确认注入锚点存在
  # ============================================================
  prepare:
    name: 🧭 机型检查
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 上游源码（仅取 filogic.mk 与 02_network/platform.sh）
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          sparse-checkout: |
            target/linux/mediatek/image/filogic.mk
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network
            target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
            package/boot/uboot-mediatek/Makefile
            package/boot/uboot-envtools/files/mediatek_filogic
          sparse-checkout-cone-mode: false

      - name: 校验机型可注入
        run: |
          echo "## 🧭 机型检查" >> "$GITHUB_STEP_SUMMARY"
          ok=1
          grep -q "TARGET_DEVICES += openembed_som7981" target/linux/mediatek/image/filogic.mk \
            && echo "✔ filogic.mk 存在插入锚点 openembed_som7981" || ok=0
          grep -q "external-static-with-rootfs" target/linux/mediatek/image/filogic.mk \
            && echo "✔ filogic.mk 支持 FIT external rootfs（rax3000m 同款链路）" || ok=0
          grep -q "define U-Boot/mt7981_cmcc_rax3000m-emmc$" package/boot/uboot-mediatek/Makefile \
            && echo "✔ uboot-mediatek 存在 rax3000m eMMC U-Boot 目标（ARTIFACT 机制可用）" || ok=0
          grep -qE '^\s*qihoo,360t7\|\\$' target/linux/mediatek/filogic/base-files/etc/board.d/02_network \
            && echo "✔ 02_network 存在 lan1-3+wan 分组锚点" || ok=0
          grep -q 'cmcc,rax3000m' target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh \
            && echo "✔ platform.sh 存在 FIT(eMMC) 升级分组锚点" || ok=0
          grep -q 'cmcc,rax3000m' package/boot/uboot-envtools/files/mediatek_filogic \
            && echo "✔ uboot-envtools 存在 FIT/eMMC bootdev 探测锚点" || ok=0
          [ "$ok" = "1" ] || { echo "::error::锚点校验失败，上游源码结构变化，注入无法进行"; exit 1; }
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✔ philips_hy3000（Philips HY3000，MT7981B，eMMC）—— itb 四件套方案（rax3000m 同款引导链）" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  build:
    name: 🏗️ HY3000 (24.10.8)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout 上游源码（istoreos-24.10 = 24.10.8 系）
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          fetch-depth: 1

      - name: 注入 HY3000 设备支持（itb 四件套方案，rax3000m 同款引导链）
        run: |
          # 1) dts：root=/dev/fit0 + chosen.rootdisk=production + factory 读 EEPROM/MAC
          python3 - <<'PY'
          import io
          dts = r'''
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT
          /*
           * Copyright (C) 2023 skygunner5 <fourking85611@yahoo.co.jp>
           */

          /dts-v1/;
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>
          #include <dt-bindings/leds/common.h>

          #include "mt7981.dtsi"

          / {
          	model = "PHILIPS HY3000";
          	compatible = "philips,hy3000", "mediatek,mt7981";

          	aliases {
          		led-boot = &red_led;
          		led-failsafe = &red_led;
          		led-running = &green_led;
          		led-upgrade = &green_led;
          		serial0 = &uart0;
          	};

          	chosen: chosen {
          		bootargs-override = "root=/dev/fit0 rootwait";
          		stdout-path = "serial0:115200n8";
          		rootdisk = <&emmc_rootdisk>;
          	};

          	memory@40000000 {
          		reg = <0 0x40000000 0 0x40000000>;
          		device_type = "memory";
          	};

          	gpio-keys {
          		compatible = "gpio-keys";

          		button-reset {
          			label = "reset";
          			linux,code = <KEY_RESTART>;
          			gpios = <&pio 1 GPIO_ACTIVE_LOW>;
          		};

          		button-mesh {
          			label = "mesh";
          			linux,code = <BTN_9>;
          			linux,input-type = <EV_SW>;
          			gpios = <&pio 0 GPIO_ACTIVE_HIGH>;
          		};
          	};

          	gpio-leds {
          		compatible = "gpio-leds";

          		green_led: led-0 {
          			function = LED_FUNCTION_STATUS;
          			color = <LED_COLOR_ID_GREEN>;
          			gpios = <&pio 13 GPIO_ACTIVE_LOW>;
          		};

          		red_led: led-1 {
          			function = LED_FUNCTION_STATUS;
          			color = <LED_COLOR_ID_RED>;
          			gpios = <&pio 8 GPIO_ACTIVE_HIGH>;
          		};
          	};
          };

          &eth {
          	status = "okay";

          	gmac0: mac@0 {
          		compatible = "mediatek,eth-mac";
          		reg = <0>;
          		phy-mode = "2500base-x";

          		nvmem-cells = <&macaddr_factory_74 0>;
          		nvmem-cell-names = "mac-address";

          		fixed-link {
          			speed = <2500>;
          			full-duplex;
          			pause;
          		};
          	};
          };

          &mdio_bus {
          	switch: switch@1f {
          		compatible = "mediatek,mt7531";
          		reg = <31>;
          		reset-gpios = <&pio 39 GPIO_ACTIVE_HIGH>;
          		interrupt-controller;
          		#interrupt-cells = <1>;
          		interrupt-parent = <&pio>;
          		interrupts = <38 IRQ_TYPE_LEVEL_HIGH>;

          		ports {
          			#address-cells = <1>;
          			#size-cells = <0>;

          			port@0 {
          				reg = <0>;
          				label = "wan";
          			};

          			port@1 {
          				reg = <1>;
          				label = "lan1";
          			};

          			port@2 {
          				reg = <2>;
          				label = "lan2";
          			};

          			port@3 {
          				reg = <3>;
          				label = "lan3";
          			};

          			port@6 {
          				reg = <6>;
          				label = "cpu";
          				ethernet = <&gmac0>;
          				phy-mode = "2500base-x";

          				fixed-link {
          					speed = <2500>;
          					full-duplex;
          					pause;
          				};
          			};
          		};
          	};
          };

          &wifi {
          	#address-cells = <1>;
          	#size-cells = <0>;
          	nvmem-cells = <&eeprom_factory_0>;
          	nvmem-cell-names = "eeprom";
          	status = "okay";

          	band@0 {
          		reg = <0>;
          		nvmem-cells = <&macaddr_factory_74 2>;
          		nvmem-cell-names = "mac-address";
          	};

          	band@1 {
          		reg = <1>;
          		nvmem-cells = <&macaddr_factory_74 3>;
          		nvmem-cell-names = "mac-address";
          	};
          };

          &mmc0 {
          	#address-cells = <1>;
          	#size-cells = <0>;
          	bus-width = <8>;
          	max-frequency = <52000000>;
          	no-sd;
          	no-sdio;
          	cap-mmc-highspeed;
          	non-removable;
          	pinctrl-names = "default", "state_uhs";
          	pinctrl-0 = <&mmc0_pins_default>;
          	pinctrl-1 = <&mmc0_pins_uhs>;
          	vmmc-supply = <&reg_3p3v>;
          	status = "okay";

          	card@0 {
          		compatible = "mmc-card";
          		reg = <0>;

          		block {
          			compatible = "block-device";

          			partitions {
          				block-partition-factory {
          					partname = "factory";

          					nvmem-layout {
          						compatible = "fixed-layout";
          						#address-cells = <1>;
          						#size-cells = <1>;

          						eeprom_factory_0: eeprom@0 {
          							reg = <0x0 0x1000>;
          						};

          						macaddr_factory_74: macaddr@74 {
          							compatible = "mac-base";
          							reg = <0x74 0x6>;
          							#nvmem-cell-cells = <1>;
          						};
          					};
          				};

          				emmc_rootdisk: block-partition-production {
          					partname = "production";
          				};
          			};
          		};
          	};
          };

          &pio {
          	mmc0_pins_default: mmc0-pins-default {
          		mux {
          			function = "flash";
          			groups = "emmc_45";
          		};
          	};

          	mmc0_pins_uhs: mmc0-pins-uhs {
          		mux {
          			function = "flash";
          			groups = "emmc_45";
          		};
          	};
          };

          &uart0 {
          	status = "okay";
          };

          &usb_phy {
          	status = "okay";
          };

          &watchdog {
          	status = "okay";
          };

          &xhci {
          	status = "okay";
          };
          '''
          io.open("target/linux/mediatek/dts/mt7981b-philips-hy3000.dts","w",encoding="utf-8",newline="\n").write(dts)
          print("已写入 dts（itb 引导链）")
          PY


          # 2) filogic.mk：sysupgrade.itb（FIT external rootfs）+ gpt/preloader/bl31-uboot 三工件
          python3 - <<'PY'
          import io, re
          block = r'''
          define Device/philips_hy3000
            DEVICE_VENDOR := PHILIPS
            DEVICE_MODEL := HY3000
            DEVICE_DTS := mt7981b-philips-hy3000
            DEVICE_DTS_DIR := ../dts
            DEVICE_DTC_FLAGS := --pad 4096
            DEVICE_DTS_LOADADDR := 0x43f00000
            DEVICE_PACKAGES := kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware kmod-usb3 \
          	f2fsck mkf2fs
            KERNEL_LOADADDR := 0x44000000
            KERNEL := kernel-bin | gzip
            KERNEL_INITRAMFS := kernel-bin | lzma | \
          	fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb with-initrd | pad-to 64k
            KERNEL_INITRAMFS_SUFFIX := -recovery.itb
            IMAGES := sysupgrade.itb
            IMAGE_SIZE := $$(shell expr 64 + $$(CONFIG_TARGET_ROOTFS_PARTSIZE))m
            IMAGE/sysupgrade.itb := append-kernel | \
          	fit gzip $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb external-static-with-rootfs | \
          	pad-rootfs | append-metadata
            ARTIFACTS := gpt.bin preloader.bin bl31-uboot.fip
            ARTIFACT/gpt.bin := mt798x-gpt emmc
            ARTIFACT/preloader.bin := mt7981-bl2 emmc-ddr4
            ARTIFACT/bl31-uboot.fip := mt7981-bl31-uboot philips_hy3000
          endef
          TARGET_DEVICES += philips_hy3000
          '''
          p = "target/linux/mediatek/image/filogic.mk"
          s = io.open(p, encoding="utf-8").read()
          if "Device/philips_hy3000" in s:
              s = re.sub(r"define Device/philips_hy3000.*?TARGET_DEVICES \+= philips_hy3000\n", block, s, flags=re.S)
          else:
              anchor = "TARGET_DEVICES += openembed_som7981\n"
              assert anchor in s, "filogic.mk 里找不到插入锚点"
              s = s.replace(anchor, anchor + "\n" + block, 1)
          io.open(p,"w",encoding="utf-8",newline="\n").write(s)
          print("已注入 filogic.mk 设备块（itb + 三工件）")
          PY


          # 3) 02_network：lan1-3 + wan 分组与 MAC（factory 0x74，wan=lan+1）
          python3 - <<'PY'
          import io
          p = "target/linux/mediatek/filogic/base-files/etc/board.d/02_network"
          s = io.open(p, encoding="utf-8").read()
          if "philips,hy3000" in s:
              print("02_network 已含 hy3000，跳过")
          else:
              a1 = "\tqihoo,360t7|\\\n\trouterich,ax3000|\\\n"
              assert s.count(a1) == 1, "02_network 接口锚点不唯一: %d" % s.count(a1)
              s = s.replace(a1, "\tphilips,hy3000|\\\n" + a1, 1)
              a2 = "\tqihoo,360t7)\n\t\tlan_mac=$(mtd_get_mac_ascii factory lanMac)"
              assert s.count(a2) == 1, "02_network MAC 锚点不唯一: %d" % s.count(a2)
              mac = ("\tphilips,hy3000)\n"
                     "\t\tlan_mac=$(mmc_get_mac_binary factory 0x74)\n"
                     "\t\twan_mac=$(macaddr_add \"$lan_mac\" 1)\n"
                     "\t\tlabel_mac=$wan_mac\n"
                     "\t\t;;\n")
              s = s.replace(a2, mac + a2, 1)
              io.open(p, "w", encoding="utf-8", newline="\n").write(s)
              print("已注入 02_network（接口 + MAC）")
          PY


          # 4) platform.sh：升级/校验/保配置全部挂到 FIT(eMMC) 分组（rax3000m 同款）
          python3 - <<'PY'
          import io
          p = "target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh"
          s = io.open(p, encoding="utf-8").read()
          if "philips,hy3000" in s:
              print("platform.sh 已含 hy3000，跳过")
          else:
              fit = "\tcmcc,rax3000m|\\\n\tcudy,tr3000-v1-ubootmod|\\\n"
              assert s.count(fit) == 1, "fit 分组锚点: %d" % s.count(fit)
              s = s.replace(fit, "\tphilips,hy3000|\\\n" + fit, 1)
              chk = "\tcmcc,rax3000m)\n\t\t[ \"$magic\" != \"d00dfeed\" ]"
              assert s.count(chk) == 1, "check 锚点: %d" % s.count(chk)
              s = s.replace(chk, "\tphilips,hy3000|\\\n" + chk, 1)
              cp = "\tcmcc,rax3000m)\n\t\tif [ \"$CI_METHOD\" = \"emmc\" ]; then"
              assert s.count(cp) == 1, "copy 锚点: %d" % s.count(cp)
              s = s.replace(cp, "\tphilips,hy3000|\\\n" + cp, 1)
              io.open(p, "w", encoding="utf-8", newline="\n").write(s)
              print("已注入 platform.sh（FIT/eMMC 升级 + 校验 + 保配置）")
          PY


          # 5) uboot-envtools：走 fit.sh/eMMC bootdev 探测
          python3 - <<'PY'
          import io
          p = "package/boot/uboot-envtools/files/mediatek_filogic"
          s = io.open(p, encoding="utf-8").read()
          if "philips,hy3000" in s:
              print("envtools 已含 hy3000，跳过")
          else:
              a = "cmcc,rax3000m|\\\njdcloud,re-cp-03)"
              assert s.count(a) == 1, "envtools 锚点: %d" % s.count(a)
              s = s.replace(a, "cmcc,rax3000m|\\\nphilips,hy3000|\\\njdcloud,re-cp-03)", 1)
              io.open(p, "w", encoding="utf-8", newline="\n").write(s)
              print("已注入 uboot-envtools")
          PY


          # 6) uboot-mediatek：注入 mt7981_philips_hy3000 U-Boot（eMMC/DDR4，bootmenu 环境）
          python3 - <<'PY'
          import io
          def newdiff(path, content):
              lines = content.split('\n')
              if lines and lines[-1] == '': lines = lines[:-1]
              return '--- /dev/null\n+++ b/%s\n@@ -0,0 +1,%d @@\n%s\n' % (path, len(lines), ''.join('+'+l+'\n' for l in lines))
          defcfg = r'''
          CONFIG_ARM=y
          CONFIG_SYS_HAS_NONCACHED_MEMORY=y
          CONFIG_POSITION_INDEPENDENT=y
          CONFIG_ARCH_MEDIATEK=y
          CONFIG_TEXT_BASE=0x41e00000
          CONFIG_SYS_MALLOC_F_LEN=0x4000
          CONFIG_NR_DRAM_BANKS=1
          CONFIG_ENV_SIZE=0x40000
          CONFIG_ENV_OFFSET=0x400000
          CONFIG_DEFAULT_DEVICE_TREE="mt7981-philips-hy3000"
          CONFIG_OF_LIBFDT_OVERLAY=y
          CONFIG_TARGET_MT7981=y
          CONFIG_PRE_CON_BUF_ADDR=0x4007EF00
          CONFIG_DEBUG_UART_BASE=0x11002000
          CONFIG_DEBUG_UART_CLOCK=40000000
          CONFIG_ENV_OFFSET_REDUND=0x440000
          CONFIG_SYS_LOAD_ADDR=0x46000000
          CONFIG_PCI=y
          CONFIG_DEBUG_UART=y
          CONFIG_AHCI=y
          CONFIG_FIT=y
          CONFIG_BOOTDELAY=30
          CONFIG_AUTOBOOT_KEYED=y
          CONFIG_AUTOBOOT_MENU_SHOW=y
          CONFIG_DEFAULT_FDT_FILE="mediatek/mt7981-philips-hy3000.dtb"
          CONFIG_LOGLEVEL=7
          CONFIG_PRE_CONSOLE_BUFFER=y
          CONFIG_LOG=y
          CONFIG_BOARD_LATE_INIT=y
          CONFIG_HUSH_PARSER=y
          CONFIG_SYS_PROMPT="MT7981> "
          CONFIG_CMD_CPU=y
          CONFIG_CMD_LICENSE=y
          # CONFIG_CMD_BOOTEFI_BOOTMGR is not set
          CONFIG_CMD_BOOTMENU=y
          CONFIG_CMD_ASKENV=y
          CONFIG_CMD_ERASEENV=y
          CONFIG_CMD_ENV_FLAGS=y
          CONFIG_CMD_STRINGS=y
          CONFIG_CMD_DM=y
          CONFIG_CMD_GPIO=y
          CONFIG_CMD_PWM=y
          CONFIG_CMD_GPT=y
          CONFIG_CMD_MMC=y
          CONFIG_CMD_PART=y
          CONFIG_CMD_PCI=y
          CONFIG_CMD_USB=y
          CONFIG_CMD_DHCP=y
          CONFIG_CMD_TFTPSRV=y
          CONFIG_CMD_RARP=y
          CONFIG_CMD_PING=y
          CONFIG_CMD_CDP=y
          CONFIG_CMD_SNTP=y
          CONFIG_CMD_DNS=y
          CONFIG_CMD_LINK_LOCAL=y
          CONFIG_CMD_PXE=y
          CONFIG_CMD_CACHE=y
          CONFIG_CMD_PSTORE=y
          CONFIG_CMD_PSTORE_MEM_ADDR=0x42ff0000
          CONFIG_CMD_UUID=y
          CONFIG_CMD_HASH=y
          CONFIG_CMD_SMC=y
          CONFIG_CMD_EXT4=y
          CONFIG_CMD_FAT=y
          CONFIG_CMD_FS_GENERIC=y
          CONFIG_CMD_FS_UUID=y
          CONFIG_OF_EMBED=y
          CONFIG_ENV_OVERWRITE=y
          CONFIG_ENV_IS_IN_MMC=y
          CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
          CONFIG_SYS_RELOC_GD_ENV_ADDR=y
          CONFIG_USE_DEFAULT_ENV_FILE=y
          CONFIG_DEFAULT_ENV_FILE="philips_hy3000_env"
          CONFIG_ENV_VARS_UBOOT_RUNTIME_CONFIG=y
          CONFIG_VERSION_VARIABLE=y
          CONFIG_NET_RANDOM_ETHADDR=y
          CONFIG_NETCONSOLE=y
          CONFIG_USE_IPADDR=y
          CONFIG_IPADDR="192.168.1.1"
          CONFIG_USE_SERVERIP=y
          CONFIG_SERVERIP="192.168.1.254"
          CONFIG_REGMAP=y
          CONFIG_SYSCON=y
          CONFIG_SCSI_AHCI=y
          CONFIG_AHCI_PCI=y
          CONFIG_MTK_AHCI=y
          CONFIG_BUTTON=y
          CONFIG_BUTTON_GPIO=y
          CONFIG_CLK=y
          CONFIG_GPIO_HOG=y
          CONFIG_LED=y
          CONFIG_LED_BLINK=y
          CONFIG_LED_GPIO=y
          CONFIG_SUPPORT_EMMC_BOOT=y
          CONFIG_MMC_HS200_SUPPORT=y
          CONFIG_MMC_MTK=y
          CONFIG_PHY_FIXED=y
          CONFIG_MEDIATEK_ETH=y
          CONFIG_PCIE_MEDIATEK=y
          CONFIG_PHY=y
          CONFIG_PHY_MTK_TPHY=y
          CONFIG_PINCTRL=y
          CONFIG_PINCONF=y
          CONFIG_PINCTRL_MT7622=y
          CONFIG_PINCTRL_MT7981=y
          CONFIG_POWER_DOMAIN=y
          CONFIG_MTK_POWER_DOMAIN=y
          CONFIG_DM_REGULATOR=y
          CONFIG_DM_REGULATOR_FIXED=y
          CONFIG_DM_REGULATOR_GPIO=y
          CONFIG_DM_PWM=y
          CONFIG_PWM_MTK=y
          CONFIG_RAM=y
          CONFIG_SCSI=y
          CONFIG_DM_SERIAL=y
          CONFIG_MTK_SERIAL=y
          CONFIG_SPI=y
          CONFIG_USB=y
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_MTK=y
          CONFIG_USB_STORAGE=y
          CONFIG_LZO=y
          CONFIG_ZSTD=y
          CONFIG_HEXDUMP=y
          CONFIG_LMB_MAX_REGIONS=64
          '''
          uboot_dts = r'''
          // SPDX-License-Identifier: GPL-2.0-only
          /*
           * Copyright (c) 2022 MediaTek Inc.
           */

          /dts-v1/;
          #include "mt7981.dtsi"
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/linux-event-codes.h>

          / {
          	#address-cells = <1>;
          	#size-cells = <1>;
          	model = "PHILIPS HY3000";
          	compatible = "mediatek,mt7981", "mediatek,mt7981-rfb";

          	chosen {
          		stdout-path = &uart0;
          		tick-timer = &timer0;
          	};

          	memory@40000000 {
          		device_type = "memory";
          		reg = <0x40000000 0x40000000>;
          	};

          	reg_3p3v: regulator-3p3v {
          		compatible = "regulator-fixed";
          		regulator-name = "fixed-3.3V";
          		regulator-min-microvolt = <3300000>;
          		regulator-max-microvolt = <3300000>;
          		regulator-boot-on;
          		regulator-always-on;
          	};

          	keys {
          		compatible = "gpio-keys";

          		button-reset {
          			label = "reset";
          			linux,code = <KEY_RESTART>;
          			gpios = <&gpio 1 GPIO_ACTIVE_LOW>;
          		};

          		button-mesh {
          			label = "mesh";
          			linux,code = <BTN_9>;
          			linux,input-type = <EV_SW>;
          			gpios = <&gpio 0 GPIO_ACTIVE_HIGH>;
          		};
          	};

          	leds {
          		compatible = "gpio-leds";

          		led-0 {
          			label = "green:status";
          			gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
          		};

          		led-1 {
          			label = "red:status";
          			gpios = <&gpio 8 GPIO_ACTIVE_HIGH>;
          		};
          	};
          };

          &eth {
          	status = "okay";
          	mediatek,gmac-id = <0>;
          	phy-mode = "2500base-x";
          	mediatek,switch = "mt7531";
          	reset-gpios = <&gpio 39 GPIO_ACTIVE_HIGH>;

          	fixed-link {
          		speed = <2500>;
          		full-duplex;
          	};
          };

          &mmc0 {
          	pinctrl-names = "default";
          	pinctrl-0 = <&mmc0_pins_default>;
          	max-frequency = <26000000>;
          	bus-width = <8>;
          	cap-mmc-hw-reset;
          	vmmc-supply = <&reg_3p3v>;
          	non-removable;
          	status = "okay";
          };

          &pinctrl {
          	mmc0_pins_default: mmc0default {
          		mux {
          			function = "flash";
          			groups =  "emmc_45";
          		};
          		conf-cmd-dat {
          			pins = "SPI0_CLK", "SPI0_MOSI", "SPI0_MISO",
          				"SPI0_CS",  "SPI0_HOLD", "SPI0_WP",
          				"SPI1_CLK", "SPI1_MOSI", "SPI1_MISO";
          			input-enable;
          			drive-strength = <MTK_DRIVE_4mA>;
          			bias-pull-up = <MTK_PUPD_SET_R1R0_01>;
          		};
          		conf-clk {
          			pins = "SPI1_CS";
          			drive-strength = <MTK_DRIVE_6mA>;
          			bias-pull-down = <MTK_PUPD_SET_R1R0_10>;
          		};
          		conf-rst {
          			pins = "PWM0";
          			drive-strength = <MTK_DRIVE_4mA>;
          			bias-pull-up = <MTK_PUPD_SET_R1R0_01>;
          		};
          	};
          };

          &uart0 {
          	mediatek,force-highspeed;
          	status = "okay";
          };

          &watchdog {
          	status = "disabled";
          };
          '''
          envf = r'''
          ipaddr=192.168.1.1
          serverip=192.168.1.254
          loadaddr=0x46000000
          console=earlycon=uart8250,mmio32,0x11002000 console=ttyS0
          bootargs=root=/dev/fit0 rootwait
          bootcmd=if pstore check ; then run boot_recovery ; else run boot_emmc ; fi
          bootconf=config-1#mt7981b-philips-hy3000
          bootdelay=0
          bootfile=openwrt-mediatek-filogic-philips_hy3000-initramfs-recovery.itb
          bootfile_bl2=openwrt-mediatek-filogic-philips_hy3000-preloader.bin
          bootfile_fip=openwrt-mediatek-filogic-philips_hy3000-bl31-uboot.fip
          bootfile_upg=openwrt-mediatek-filogic-philips_hy3000-squashfs-sysupgrade.itb
          bootfile_gpt=openwrt-mediatek-filogic-philips_hy3000-gpt.bin
          bootled_pwr=red:status
          bootled_rec=green:status
          _init_env=setenv _init_env ; saveenv ; saveenv
          _firstboot=setenv _firstboot ; run _switch_to_menu ; run _init_env ; run boot_first
          _switch_to_menu=setenv _switch_to_menu ; setenv bootdelay 3 ; setenv bootmenu_delay 3 ; setenv bootmenu_0 $bootmenu_0d ; setenv bootmenu_0d ; run _bootmenu_update_title
          _bootmenu_update_title=setenv _bootmenu_update_title ; setenv bootmenu_title "$bootmenu_title       $ver"
          bootmenu_confirm_return=askenv - Press ENTER to return to menu ; bootmenu 60
          bootmenu_default=0
          bootmenu_delay=0
          bootmenu_title=      OpenWrt [eMMC]
          bootmenu_0=Initialize environment.=run _firstboot
          bootmenu_0d=Run default boot command.=run boot_default
          bootmenu_1=Boot system via TFTP.=run boot_tftp ; run bootmenu_confirm_return
          bootmenu_2=Boot production system from eMMC.=run boot_production ; run bootmenu_confirm_return
          bootmenu_3=Boot recovery system from eMMC.=run boot_recovery ; run bootmenu_confirm_return
          bootmenu_4=Load production system via TFTP then write to eMMC.=setenv noboot 1 ; setenv replacevol 1 ; run boot_tftp_production ; setenv noboot ; setenv replacevol ; run bootmenu_confirm_return
          bootmenu_5=Load recovery system via TFTP then write to eMMC.=setenv noboot 1 ; setenv replacevol 1 ; run boot_tftp_recovery ; setenv noboot ; setenv replacevol ; run bootmenu_confirm_return
          bootmenu_6=Load BL31+U-Boot FIP via TFTP then write to eMMC.=run boot_tftp_write_fip ; run bootmenu_confirm_return
          bootmenu_7=Load BL2 preloader via TFTP then write to eMMC.=run boot_tftp_write_bl2 ; run bootmenu_confirm_return
          bootmenu_8=Load eMMC GPT via TFTP.=run boot_tftp_write_gpt ; run bootmenu_confirm_return
          bootmenu_9=Reboot.=reset
          bootmenu_10=Reset all settings to factory defaults.=run reset_factory ; reset
          boot_first=if button reset ; then led $bootled_rec on ; run boot_tftp_recovery ; setenv flag_recover 1 ; run boot_default ; fi ; bootmenu
          boot_default=if env exists flag_recover ; then else run bootcmd ; fi ; run boot_recovery ; setenv replacevol 1 ; run boot_tftp_forever
          boot_production=led $bootled_pwr on ; run emmc_read_production && bootm $loadaddr#$bootconf ; led $bootled_pwr off
          boot_recovery=led $bootled_rec on ; run emmc_read_recovery && bootm $loadaddr#$bootconf ; led $bootled_rec off
          boot_emmc=run boot_production ; run boot_recovery
          boot_tftp_forever=led $bootled_rec on ; while true ; do run boot_tftp_recovery ; sleep 1 ; done
          boot_tftp_production=tftpboot $loadaddr $bootfile_upg && env exists replacevol && iminfo $loadaddr && run emmc_write_production ; if env exists noboot ; then else bootm $loadaddr#$bootconf ; fi
          boot_tftp_recovery=tftpboot $loadaddr $bootfile && env exists replacevol && iminfo $loadaddr && run emmc_write_recovery ; if env exists noboot ; then else bootm $loadaddr#$bootconf ; fi
          boot_tftp_write_fip=tftpboot $loadaddr $bootfile_fip && run emmc_write_fip
          boot_tftp_write_bl2=tftpboot $loadaddr $bootfile_bl2 && run emmc_write_bl2
          boot_tftp_write_gpt=tftpboot $loadaddr $bootfile_gpt && run emmc_write_gpt
          boot_tftp=tftpboot $loadaddr $bootfile && bootm $loadaddr#$bootconf
          mmc_write_vol=imszb $loadaddr image_size && test 0x$image_size -le 0x$part_size && mmc erase 0x$part_addr 0x$image_size && mmc write $loadaddr 0x$part_addr 0x$image_size
          mmc_read_vol=mmc read $loadaddr $part_addr 0x100 && imszb $loadaddr image_size && test 0x$image_size -le 0x$part_size && mmc read $loadaddr $part_addr 0x$image_size && setexpr filesize $image_size * 0x200
          part_default=production
          part_recovery=recovery
          reset_factory=eraseenv && reset
          emmc_read_production=part start mmc 0 $part_default part_addr && part size mmc 0 $part_default part_size && run mmc_read_vol
          emmc_read_recovery=part start mmc 0 $part_recovery part_addr && part size mmc 0 $part_recovery part_size && run mmc_read_vol
          emmc_write_bl2=mmc partconf 0 1 1 1 && mmc erase 0x0 0x400 && mmc write $fileaddr 0x0 0x400 ; mmc partconf 0 1 1 0
          emmc_write_fip=mmc erase 0x3400 0x2000 && mmc write $fileaddr 0x3400 0x2000 && mmc erase 0x2000 0x800
          emmc_write_gpt=mmc write $fileaddr 0x0 0x22
          emmc_write_production=part start mmc 0 $part_default part_addr && part size mmc 0 $part_default part_size && run mmc_write_vol
          emmc_write_recovery=part start mmc 0 $part_recovery part_addr && part size mmc 0 $part_recovery part_size && run mmc_write_vol
          '''
          files = [
              ('configs/mt7981_philips_hy3000_defconfig', defcfg),
              ('arch/arm/dts/mt7981-philips-hy3000.dts', uboot_dts),
              ('philips_hy3000_env', envf),
          ]
          patch = ''.join(newdiff(p, c) for p, c in files)
          io.open("package/boot/uboot-mediatek/patches/475-add-philips_hy3000.patch","w",encoding="utf-8",newline="\n").write(patch)
          print("已写入 uboot-mediatek 475 补丁（defconfig + dts + env）")

          import re
          p = "package/boot/uboot-mediatek/Makefile"
          s = io.open(p, encoding="utf-8").read()
          if "mt7981_philips_hy3000" in s:
              print("Makefile 已含目标，跳过")
          else:
              anchor = "define U-Boot/mt7981_cmcc_rax3000m-emmc\n"
              assert s.count(anchor) == 1, "Makefile define 锚点: %d" % s.count(anchor)
              newdef = ("define U-Boot/mt7981_philips_hy3000\n"
                        "  NAME:=PHILIPS HY3000\n"
                        "  BUILD_SUBTARGET:=filogic\n"
                        "  BUILD_DEVICES:=philips_hy3000\n"
                        "  UBOOT_CONFIG:=mt7981_philips_hy3000\n"
                        "  UBOOT_IMAGE:=u-boot.fip\n"
                        "  BL2_BOOTDEV:=emmc\n"
                        "  BL2_SOC:=mt7981\n"
                        "  BL2_DDRTYPE:=ddr4\n"
                        "  DEPENDS:=+trusted-firmware-a-mt7981-emmc-ddr4\n"
                        "endef\n\n")
              s = s.replace(anchor, newdef + anchor, 1)
              ta = "mt7981_cmcc_rax3000m-emmc \\\n"
              assert s.count(ta) >= 1, "UBOOT_TARGETS 锚点缺失"
              s = s.replace(ta, ta + "mt7981_philips_hy3000 \\\n", 1)
              io.open(p, "w", encoding="utf-8", newline="\n").write(s)
              print("已注册 U-Boot/mt7981_philips_hy3000")
          PY



          echo "===== 注入结果 ====="
          grep -n "philips" target/linux/mediatek/image/filogic.mk | head -3
          grep -n "philips" target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          grep -n "philips" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
          grep -n "philips" package/boot/uboot-envtools/files/mediatek_filogic
          grep -n "mt7981_philips_hy3000" package/boot/uboot-mediatek/Makefile | head -3
          ls -la package/boot/uboot-mediatek/patches/ | tail -3

          # u-boot 2024.10 的 mt7981.dtsi 只有 &pinctrl / &gpio 两个标签（没有 &pio），
          # 用错标签 dtc 会报 "Label or path pio not found" 导致变体编译失败。
          P=package/boot/uboot-mediatek/patches/475-add-philips_hy3000.patch
          if grep -n '&pio[ <]' "$P"; then
            echo "::error::U-Boot dts 使用了 &pio，24.10 的 u-boot 只认 &pinctrl / &gpio"
            exit 1
          fi
          for lab in gpio pinctrl mmc0 eth uart0 watchdog; do
            grep -q "&$lab" "$P" || { echo "::error::U-Boot dts 缺少 &$lab 节点"; exit 1; }
          done
          echo "✔ U-Boot dts 标签校验通过（&gpio / &pinctrl / &mmc0 / &eth / &uart0 / &watchdog）"
      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          set +e
          # runner 自带 azure 内网镜像，DNS 偶发/持续解析失败时 apt 全军覆没。
          # 注意：apt-get update 对 "Failed to fetch" 这类警告返回码仍是 0，
          # 所以不能用 $? 判断，必须看输出内容；镜像失败就按序轮换公共源。
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib
          gettext git libncurses-dev libssl-dev libelf-dev python3-dev python3-setuptools
          rsync unzip zlib1g-dev file wget ccache zstd swig time xsltproc subversion bc
          patch bzip2 libtool-bin pkg-config autoconf automake"
          PKGS=$(echo $PKGS)

          SRC_FILE=/etc/apt/sources.list.d/ubuntu.sources
          write_mirror() {
            printf 'Types: deb\nURIs: %s\nSuites: noble noble-updates noble-backports noble-security\nComponents: main universe restricted multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' "$1" \
              | sudo tee "$SRC_FILE" >/dev/null
            sudo rm -rf /var/lib/apt/lists/*
          }
          apt_update() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                         -o Acquire::https::Timeout=20 update 2>&1 \
              | tee _apt_update.log | grep -E "^(E:|W:)" | head -10
            true
          }
          apt_ok() { ! grep -qE "Failed to fetch|Temporary failure resolving|Some index files failed|^E: " _apt_update.log; }

          MIRRORS=(http://archive.ubuntu.com/ubuntu/ https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ http://mirrors.ustc.edu.cn/ubuntu/)

          update_until_ok() {
            apt_update
            apt_ok && return 0
            for m in "${MIRRORS[@]}"; do
              echo "::warning::apt update 失败（azure 镜像 DNS 抖动），切换到公共源 $m"
              write_mirror "$m"
              apt_update
              apt_ok && return 0
            done
            echo "::warning::所有镜像源的 update 都失败，尝试用 runner 预装工具继续"
            return 1
          }

          update_until_ok
          ok=0
          for i in 1 2 3 4 5; do
            if sudo apt-get install -y -qq $PKGS; then ok=1; break; fi
            echo "::warning::apt install 第 $i 次失败，15 秒后重新 update 再试"
            sleep 15
            update_until_ok
          done
          sudo apt-get install -y -qq perl libthread-queue-any-perl >/dev/null 2>&1

          # 按工具名验收：runner 镜像本身已预装大部分依赖，缺哪个才是真问题
          miss=
          for t in gcc g++ make clang flex bison gawk gettext rsync unzip zstd \
                   xsltproc svn bc patch bzip2 pkg-config autoconf automake swig ccache; do
            command -v "$t" >/dev/null 2>&1 || miss="$miss $t"
          done
          [ -f /usr/include/openssl/ssl.h ] || miss="$miss libssl-dev"
          [ -f /usr/include/libelf.h ] || miss="$miss libelf-dev"
          [ -f /usr/include/ncurses.h ] || miss="$miss libncurses-dev"
          if [ -n "$miss" ]; then
            echo "::error::缺少编译依赖：$miss（apt install 结果 ok=$ok，网络/DNS 持续故障时重跑可能仍失败）"
            exit 1
          fi
          echo "✔ 编译依赖齐备（apt install ok=$ok）"

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hy3000-2410-${{ github.sha }}
          restore-keys: |
            ccache-hy3000-2410-
            ccache-

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi

          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      - name: 生成 .config（单机型 + 自动规避 feeds 的 Kconfig 递归依赖）
        env:
          DEVICE: philips_hy3000
          PACKAGES: ${{ inputs.packages || 'luci luci-compat luci-i18n-base-zh-cn luci-app-store kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-basic-mbedtls wireless-regdb iwinfo' }}
          PROTECTED: luci luci-base luci-compat luci-app-store istoreos-files base-files kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-basic-mbedtls wireless-regdb
        run: |
          cat > gen_config.py <<'PY'
          import os, re, sys

          want = [os.environ["DEVICE"]]
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())

          meta = open("tmp/.config-target.in", encoding="utf-8", errors="replace").read()

          raw = re.findall(r"^\s*menuconfig\s+(TARGET_DEVICE_mediatek_filogic_DEVICE_\S+)\s*$",
                           meta, re.M)
          pref = "TARGET_DEVICE_mediatek_filogic_DEVICE_"
          syms = {}
          for s in raw:
              syms[norm(s[len(pref):])] = "CONFIG_" + s
          print("元数据 filogic 机型符号: %d 行 -> %d 个唯一机型" % (len(raw), len(syms)))
          if not syms:
              print("::error::元数据里没有 filogic 机型符号（tmp/.config-target.in 不完整）")
              sys.exit(1)

          multi = "TARGET_MULTI_PROFILE" in meta
          print("元数据含 Target Devices 菜单（需 MULTI_PROFILE）: %s" % multi)

          picked, missing = [], []
          for d in want:
              s = syms.get(norm(d))
              (picked.append(s) if s else missing.append(d))
          if missing:
              print("::error::源码树中不存在这些机型: %s" % " ".join(missing))
              sys.exit(1)

          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]
          lines = ["CONFIG_TARGET_mediatek=y",
                   "CONFIG_TARGET_mediatek_filogic=y",
                   "CONFIG_DEVEL=y",
                   "CONFIG_CCACHE=y"]
          if multi:
              lines += ["CONFIG_TARGET_MULTI_PROFILE=y",
                        "# CONFIG_TARGET_ALL_PROFILES is not set",
                        "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"]
          lines += ["%s=y" % s for s in picked]
          lines += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]
          open(".config", "w").write("\n".join(lines) + "\n")
          open("wanted.txt", "w").write("\n".join(want) + "\n")
          print("已写入 %d 台机型 + %d 个额外包" % (len(picked), len(pkgs)))
          PY

          cat > verify_config.py <<'PY'
          import re, sys

          want = [l.strip() for l in open("wanted.txt") if l.strip()]
          cfg = open(".config", encoding="utf-8", errors="replace").read()
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())
          got = {norm(m) for m in
                 re.findall(r"^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_(\S+)=y$", cfg, re.M)}
          wset = {norm(w): w for w in want}
          lost = [w for k, w in wset.items() if k not in got]
          print("预期 %d 台，.config 实际选中 %d 台" % (len(wset), len(got & set(wset))))
          if lost:
              print("::warning::被 kconfig 丢弃 %d 台: %s" % (len(lost), " ".join(lost)))
              mp = [l.strip() for l in cfg.splitlines() if "MULTI_PROFILE" in l]
              print("MULTI_PROFILE 状态: %s" % (mp or "（.config 里没有该符号）"))
              sys.exit(1)
          # WiFi 驱动复核：缺任何一个 LuCI 就没有无线
          missing_wifi = 0
          for p in ("kmod-mt7915e", "kmod-mt7981-firmware", "mt7981-wo-firmware",
                    "wpad-basic-mbedtls", "wireless-regdb"):
              flag = "CONFIG_PACKAGE_%s=y" % p
              ok = flag in cfg
              print(("OK   " if ok else "MISS ") + flag)
              missing_wifi += 0 if ok else 1
          for p in ("luci", "luci-app-store", "istoreos-files"):
              flag = "CONFIG_PACKAGE_%s=y" % p
              print(("OK   " if flag in cfg else "WARN ") + flag)
          if missing_wifi:
              print("::error::WiFi 驱动包缺失 %d 个，固件将没有无线" % missing_wifi)
              sys.exit(1)
          PY

          mkdir -p tmp
          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"

            if ! make -j1 prepare-tmpinfo > prepare.log 2>&1; then
              tail -40 prepare.log
              echo "::endgroup::"
              echo "::error::prepare-tmpinfo 失败（主机依赖缺失或 package 元数据有错），见上方日志"
              exit 1
            fi
            grep -E "Please install|Build dependency|Failed to build" prepare.log | head -10 || true

            python3 gen_config.py

            if ! make -j1 defconfig > defconfig.log 2>&1; then
              tail -40 defconfig.log
              echo "::endgroup::"
              echo "::error::make defconfig 执行失败"
              exit 1
            fi

            vrc=0
            python3 verify_config.py || vrc=$?

            if [ "$vrc" = "0" ]; then
              ok=1
              echo "::endgroup::"
              break
            fi

            if grep -q "recursive dependency detected" defconfig.log; then
              echo "::warning::检测到 Kconfig 递归依赖（feed 元数据 bug），禁用问题包后重试"
              grep -A2 "recursive dependency detected" defconfig.log | head -8 || true
              bad=$(grep -oE "symbol PACKAGE_[A-Za-z0-9_.+-]+ depends on PACKAGE_" defconfig.log \
                    | sed -E 's/^symbol PACKAGE_([^ ]+) .*/\1/' | sort -u)
              echo "问题包: ${bad:-（未解析出包名）}"
              changed=0
              for p in $bad; do
                if echo " $PROTECTED " | grep -q " $p "; then
                  echo "::error::$p 属于必需包（含 WiFi 驱动），不能自动禁用，请手工修 feed"
                  echo "::endgroup::"
                  exit 1
                fi
                while IFS= read -r d; do
                  [ -z "$d" ] && continue
                  if [ -f "$d/Makefile" ]; then
                    mv "$d/Makefile" "$d/Makefile.disabled"
                    echo "已禁用: $d"
                    changed=1
                  fi
                done < <(find feeds package/feeds -maxdepth 3 -type d -name "$p" 2>/dev/null || true)
              done
              echo "::endgroup::"
              if [ "$changed" = "1" ]; then
                rm -f tmp/.packageinfo tmp/.config-package.in
                continue
              fi
              echo "::error::检测到递归依赖但没定位到包目录，见 defconfig.log"
              exit 1
            fi

            echo "::error::.config 校验未通过，且 defconfig 没有递归依赖报错"
            echo "===== .config 前 25 行 ====="
            head -25 .config || true
            echo "===== defconfig.log 尾部 ====="
            tail -30 defconfig.log || true
            echo "::endgroup::"
            exit 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::尝试 3 次仍未得到有效 .config"
            exit 1
          fi

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"
          find dl -size -1024c -exec rm -f {} \;

      - name: 单编 U-Boot（提前暴露 uboot 变体问题）
        run: |
          set +e
          # 裸树上单编 package 前必须先备好交叉工具链，否则 package/libs/toolchain
          # 拷贝 ld-musl-*.so* 时源文件不存在而失败（run 43049969078 的教训）
          if ! ls staging_dir/toolchain-*/lib/ld-musl-*.so* >/dev/null 2>&1; then
            make -j"$(nproc)" toolchain/compile > toolchain.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::toolchain 编译失败（真实错误见 toolchain.log）"
              tail -n 100 toolchain.log || true
              exit 1
            fi
          fi
          make -j"$(nproc)" package/boot/uboot-mediatek/compile V=s > uboot.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::uboot-mediatek 单编失败（真实错误见 uboot.log）"
            echo "===== uboot.log 中的错误行 ====="
            grep -nE "Error [0-9]|\*\*\*|error:|No rule to make|undefined|not found|Label or path" uboot.log | tail -60 || true
            echo "===== uboot.log 尾部 200 行 ====="
            tail -n 200 uboot.log || true
            exit 1
          fi
          grep -cE "^" uboot.log >/dev/null 2>&1 || true
          echo "✔ uboot-mediatek 单编通过（mt7981_philips_hy3000）"

      - name: 编译
        run: |
          set +e
          set -o pipefail
          nproc
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败（静默模式下失败包的报错被吞），用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              echo "未提取到失败包名，对全树 -j1 V=s 复现（到失败点即停）"
              make -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  target/linux|package/*)
                    echo "===== V=s 复现 $p ====="
                    make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  *)
                    echo "未知失败目标 $p，跳过 V=s";;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi
          exit 0

      - name: 失败诊断
        if: failure()
        run: |
          for f in prepare.log defconfig.log feeds-update.log feeds-install.log uboot.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-hy3000-2410
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验产物
        run: |
          mkdir -p out
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*philips*hy3000*sysupgrade.itb' \
               -o -name '*philips*hy3000*gpt.bin' \
               -o -name '*philips*hy3000*preloader.bin' \
               -o -name '*philips*hy3000*bl31-uboot.fip' \
               -o -name 'sha256sums' -o -name 'profiles.json' \
               -o -name '*.buildinfo' -o -name '*.manifest' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          # recovery（initramfs）一并保留：U-Boot 菜单 TFTP 引导 / 网页刷机用
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*philips*hy3000*recovery.itb' \
            -exec cp {} out/ \; 2>/dev/null || true

          if ! ls out/ 2>/dev/null | grep -qE "philips.*hy3000.*sysupgrade.itb"; then
            echo "::error::$DEVICE 没有找到 sysupgrade.itb 产物"
            ls -la out/ bin/targets/mediatek/filogic/ 2>/dev/null || true
            exit 1
          fi
          for a in gpt.bin preloader.bin bl31-uboot.fip; do
            ls out/ | grep -q "philips.*hy3000.*$a" || { echo "::error::缺少引导工件 $a"; exit 1; }
          done
          echo "产物文件数: $(ls out | wc -l)"
          {
            echo "## 🏗️ iStoreOS 24.10.8 · Philips HY3000 编译完成"
            echo ""
            echo "- 产物文件: $(ls out | wc -l) 个"
            echo "- WiFi: mt76（kmod-mt7915e）+ wpad，LuCI 网络→无线可用"
            echo ""
            echo "| 文件 |"
            echo "|---|"
            ls out | while read -r f; do echo "| $f |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-hy3000-2410
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 3：发布到 Release（只新增，绝不删除/覆盖历史 release）
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [prepare, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-hy3000-2410
          path: rel

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true

      - name: 创建 Release（istoreos-hy3000-2410-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="istoreos-hy3000-2410-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          iStoreOS 24.10.8（源码 istoreos/istoreos istoreos-24.10 分支）自动编译
          （Philips HY3000，MT7981B，eMMC）

          - 触发方式: ${{ github.event_name }}
          - 机型: philips_hy3000（MT7981B + MT7531，2.5G 上行，eMMC）
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          WiFi：mt76（kmod-mt7915e）+ wpad，2.4G/5G 双频（iStoreOS 默认关闭无线，
          进 LuCI 网络→无线手动启用即可）。注意 iStoreOS 默认账户 root / 密码空。

          本固件为 FIT(itb) 镜像，配套社区 bl-mt798x U-Boot（eMMC GPT 布局）：
          - preloader.bin  → BL2，写 eMMC boot0 硬件分区（mmc partconf 0 1 1 1）
          - bl31-uboot.fip → 写用户区 0x3400 扇区（U-Boot FIP）
          - gpt.bin        → 写用户区扇区 0（GPT 分区表）
          - sysupgrade.itb → production 分区系统镜像（U-Boot 网页/菜单刷入）
          - initramfs-recovery.itb → 临时救援/恢复镜像（U-Boot 菜单 TFTP 引导）
          在已装社区 U-Boot 的机器上：U-Boot 网页刷 sysupgrade.itb 即可；
          原厂/安卓系统需先按 rax3000m 流程刷入 bl2+fip+gpt 三引导工件。
          EOF
          gh release create "$TAG" rel/* \
            --title "iStoreOS HY3000 · 24.10.8 · $TAG" \
            --notes-file notes.md \
            --latest
