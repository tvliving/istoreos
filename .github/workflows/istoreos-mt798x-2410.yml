name: 🍞 iStoreOS MT798x Build 24.10.8 (7981/7986/7988)

# 每周一、周四 07:00 (北京时间) 自动编译 = UTC 周日/周三 23:00
on:
  schedule:
    - cron: '0 23 * * 0,3'
  workflow_dispatch:
    inputs:
      groups:
        description: '1、编译哪些芯片（BOTH=7981+7986+7988，按精选清单）'
        required: false
        default: 'BOTH'
        type: choice
        options:
          - 'BOTH'
          - 'MT7981'
          - 'MT7986'
          - 'MT7988'
      mode:
        description: '2、机型范围（精选=社区常用已适配机型；全量=该芯片全部机型）'
        required: false
        default: 'curated'
        type: choice
        options:
          - 'curated'
          - 'all'
          - 'custom'
      devices:
        description: '3、自定义机型（mode=custom 时生效，空格/逗号分隔，如 cmcc_rax3000m cudy_tr3000-v1）'
        required: false
        default: ''
      exclude:
        description: '4、排除机型（空格分隔，如 xiaomi_mi-router-ax3000t-ubootmod）'
        required: false
        default: ''
      packages:
        description: '5、额外固件包（空格分隔，默认已含 luci + iStore）'
        required: false
        default: 'luci luci-compat luci-i18n-base-zh-cn luci-app-store'
      make_release:
        description: '6、是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: istoreos-mt798x-2410-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 编译目标版本：iStoreOS 24.10.8
  # 上游 istoreos/istoreos 没有 24.10.8 的 tag，24.10 系列的源码分支就是 istoreos-24.10
  SRC_REPO: istoreos/istoreos
  SRC_REF: istoreos-24.10
  VERSION: 24.10.8

jobs:
  # ============================================================
  # Job 1：解析机型清单（按 DEVICE_DTS 判定 MT7981 / MT7986 / MT7988）
  # ============================================================
  prepare:
    name: 🧭 机型清单
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      src_sha: ${{ steps.srcver.outputs.sha }}
    steps:
      - name: Checkout (仅取 filogic.mk，来自上游 istoreos-24.10)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          sparse-checkout: target/linux/mediatek/image/filogic.mk
          sparse-checkout-cone-mode: false

      - name: 记录源码版本
        id: srcver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 解析并生成清单
        id: plan
        env:
          GROUPS: ${{ inputs.groups || 'BOTH' }}
          MODE: ${{ inputs.mode || 'curated' }}
          CUSTOM: ${{ inputs.devices || '' }}
          EXCLUDE: ${{ inputs.exclude || '' }}
        run: |
          python3 - <<'PY'
          import os, re, json

          MK = "target/linux/mediatek/image/filogic.mk"
          lines = open(MK, encoding="utf-8", errors="replace").read().splitlines()

          # ---- 1. 收集 define Device/xxx ... endef 块 ----
          blocks, cur, buf = {}, None, []
          for line in lines:
              m = re.match(r"\s*define\s+Device/([A-Za-z0-9_.\-]+)\s*$", line)
              if m:
                  cur, buf = m.group(1), []
                  continue
              if cur and re.match(r"\s*endef\s*$", line):
                  blocks[cur] = buf
                  cur = None
                  continue
              if cur is not None:
                  buf.append(line)

          def resolve(name, depth=0, seen=None):
              """沿父模板链取 DEVICE_DTS（纯继承设备也不会漏）"""
              seen = seen or set()
              if name in seen or depth > 8 or name not in blocks:
                  return None
              seen.add(name)
              dts = parent = None
              for line in blocks[name]:
                  mm = re.search(r"DEVICE_DTS\s*:?=\s*\"?([A-Za-z0-9_./\-]+)\"?", line)
                  if mm and not dts:
                      dts = mm.group(1)
                  mp = re.search(r"\$\(call\s+Device/([A-Za-z0-9_.\-]+)\)", line)
                  if mp and not parent:
                      parent = mp.group(1)
              if not dts and parent:
                  dts = resolve(parent, depth + 1, seen)
              return dts

          # ---- 2. 设备全集取 TARGET_DEVICES，避免把模板当设备 ----
          targets = set()
          for line in lines:
              if "TARGET_DEVICES" in line and "+=" in line:
                  for tok in re.split(r"[\s\\]+", line.split("+=", 1)[1]):
                      tok = tok.strip()
                      if tok and re.fullmatch(r"[A-Za-z0-9_.\-]+", tok):
                          targets.add(tok)

          groups = {"MT7981": [], "MT7986": [], "MT7988": [], "OTHER": []}
          for d in sorted(targets):
              dts = (resolve(d) or "").lower()
              if dts.startswith("mt7981"):
                  groups["MT7981"].append(d)
              elif dts.startswith("mt7986"):
                  groups["MT7986"].append(d)
              elif dts.startswith("mt7988"):
                  groups["MT7988"].append(d)
              else:
                  groups["OTHER"].append(d)

          print("机型总数: %d (MT7981=%d MT7986=%d MT7988=%d OTHER=%d)" %
                (len(targets), len(groups["MT7981"]), len(groups["MT7986"]),
                 len(groups["MT7988"]), len(groups["OTHER"])))

          # ---- 3. 精选清单（对照 istoreos-24.10 源码树核对过，全部存在）----
          CURATED = {
              "MT7981": """cmcc_rax3000m cmcc_a10-stock cudy_tr3000-v1 cudy_tr3000-256mb-v1
                           cudy_m3000-v1 glinet_gl-mt3000 jcg_q30-pro xiaomi_mi-router-ax3000t
                           xiaomi_mi-router-wr30u-stock qihoo_360t7 h3c_magic-nx30-pro
                           zbtlink_zbt-z8103ax nokia_ea0326gmp""".split(),
              "MT7986": """glinet_gl-mt6000 xiaomi_redmi-router-ax6000-stock netcore_n60
                           jdcloud_re-cp-03 asus_tuf-ax4200 tplink_tl-xdr6088 tplink_tl-xdr6086
                           bananapi_bpi-r3 bananapi_bpi-r3-mini""".split(),
              "MT7988": """bananapi_bpi-r4 bananapi_bpi-r4-poe arcadyan_mozart""".split(),
          }

          mode = os.environ.get("MODE", "curated").strip() or "curated"
          exclude = set(os.environ.get("EXCLUDE", "").replace(",", " ").split())
          want_groups = os.environ.get("GROUPS", "BOTH").strip() or "BOTH"
          if want_groups == "BOTH":
              want_groups = ["MT7981", "MT7986", "MT7988"]
          else:
              want_groups = [want_groups]

          custom = [x for x in re.split(r"[\s,]+", os.environ.get("CUSTOM", "").strip()) if x]

          os.makedirs("plan", exist_ok=True)
          matrix, unknown, rows = [], [], []
          known_all = groups["MT7981"] + groups["MT7986"] + groups["MT7988"]

          for g in ["MT7981", "MT7986", "MT7988"]:
              if g not in want_groups:
                  continue
              if mode == "all":
                  sel = groups[g]
              elif mode == "custom":
                  # 自定义列表里不属于本芯片的机型自动过滤
                  sel = [d for d in custom if d in groups[g]]
                  unknown += [d for d in custom if d not in known_all]
              else:
                  sel = [d for d in CURATED[g] if d in groups[g]]
                  lost = [d for d in CURATED[g] if d not in groups[g]]
                  if lost:
                      print("::warning::精选清单中这些机型在本源码树里不存在，已跳过: %s" % " ".join(lost))

              sel = [d for d in sel if d not in exclude]
              if not sel:
                  print("::warning::%s 没有可编译机型，跳过该组" % g)
                  continue

              fname = "%s.txt" % g.lower()
              with open(os.path.join("plan", fname), "w") as f:
                  f.write("\n".join(sel) + "\n")
              matrix.append({"group": g, "count": len(sel), "file": fname})
              rows.append((g, len(sel), sel))

          if unknown:
              print("::warning::自定义清单里这些机型不存在，已忽略: %s" % " ".join(sorted(set(unknown))))

          total = sum(m["count"] for m in matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=%s\n" % json.dumps(matrix, separators=(",", ":")))
              f.write("total=%d\n" % total)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 🧭 机型清单（模式: %s）\n\n" % mode)
              f.write("| 芯片 | 台数 | 机型 |\n|---|---|---|\n")
              for g, n, sel in rows:
                  f.write("| %s | %d | %s |\n" % (g, n, "<br>".join(sel)))
              f.write("\n源码树可用机型：MT7981 %d 台 / MT7986 %d 台 / MT7988 %d 台\n" %
                      (len(groups["MT7981"]), len(groups["MT7986"]), len(groups["MT7988"])))
          PY

      - name: 上传清单
        uses: actions/upload-artifact@v4
        with:
          name: device-plan
          path: plan/
          retention-days: 3

  # ============================================================
  # Job 2：按芯片分组编译（每组一次内核编译，产出该组全部机型）
  # ============================================================
  build:
    name: 🏗️ ${{ matrix.group }} (${{ matrix.count }} 台)
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout 源码（上游 istoreos-24.10 = 24.10.8 系）
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          # 大型预装组件：dotnet/android/ghc/CodeQL/boost/node/jvm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd 2>/dev/null || true
          # Docker 镜像与容器层（编译用不到，可释放 6-10GB）
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          # apt 缓存与用户缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          # 系统日志与崩溃转储
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          # 少数 perl 模块在精简镜像里可能缺，装不上也不阻塞（prereq 会明确报）
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true

      - name: 下载清单
        uses: actions/download-artifact@v4
        with:
          name: device-plan
          path: plan

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mt798x2410-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            ccache-mt798x2410-${{ matrix.group }}-
            ccache-

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi

          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      - name: 生成 .config（多机型 + 自动规避 feeds 的 Kconfig 递归依赖）
        env:
          DEVICE_FILE: plan/${{ matrix.file }}
          PACKAGES: ${{ inputs.packages || 'luci luci-compat luci-i18n-base-zh-cn luci-app-store' }}
          PROTECTED: luci luci-base luci-compat luci-app-store istoreos-files base-files
        run: |
          # 辅助脚本先落盘，避免在 for 循环里嵌套 heredoc
          cat > gen_config.py <<'PY'
          import os, re, sys

          want = [l.strip() for l in open(os.environ["DEVICE_FILE"])
                  if l.strip() and not l.startswith("#")]
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())

          meta = open("tmp/.config-target.in", encoding="utf-8", errors="replace").read()

          # 机型符号在元数据里是：menuconfig TARGET_DEVICE_<boardconf>_DEVICE_<dev>
          raw = re.findall(r"^\s*menuconfig\s+(TARGET_DEVICE_mediatek_filogic_DEVICE_\S+)\s*$",
                           meta, re.M)
          pref = "TARGET_DEVICE_mediatek_filogic_DEVICE_"
          syms = {}
          for s in raw:
              syms[norm(s[len(pref):])] = "CONFIG_" + s
          print("元数据 filogic 机型符号: %d 行 -> %d 个唯一机型" % (len(raw), len(syms)))
          if not syms:
              print("::error::元数据里没有 filogic 机型符号（tmp/.config-target.in 不完整）")
              sys.exit(1)

          # 关键：所有 TARGET_DEVICE_* 都位于 menu "Target Devices" 内，
          # 而该菜单写着 depends on TARGET_MULTI_PROFILE。不显式打开它时，
          # kconfig 认为这些符号不可见，--defconfig 会把它们全部丢弃 -> 选中 0 台。
          multi = "TARGET_MULTI_PROFILE" in meta
          print("元数据含 Target Devices 菜单（需 MULTI_PROFILE）: %s" % multi)
          if not multi:
              print("::warning::元数据里没有 TARGET_MULTI_PROFILE，按老版 kconfig 结构继续")

          picked, missing = [], []
          for d in want:
              s = syms.get(norm(d))
              (picked.append(s) if s else missing.append(d))
          if missing:
              print("::error::源码树中不存在这些机型: %s" % " ".join(missing))
              sys.exit(1)

          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]
          lines = ["CONFIG_TARGET_mediatek=y",
                   "CONFIG_TARGET_mediatek_filogic=y",
                   "CONFIG_DEVEL=y",
                   "CONFIG_CCACHE=y"]
          if multi:
              lines += ["CONFIG_TARGET_MULTI_PROFILE=y",
                        "# CONFIG_TARGET_ALL_PROFILES is not set",
                        "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"]
          lines += ["%s=y" % s for s in picked]
          lines += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]
          open(".config", "w").write("\n".join(lines) + "\n")
          open("wanted.txt", "w").write("\n".join(want) + "\n")
          print("已写入 %d 台机型 + %d 个额外包%s"
                % (len(picked), len(pkgs), "（多机型模式）" if multi else ""))
          PY

          cat > verify_config.py <<'PY'
          import re, sys

          want = [l.strip() for l in open("wanted.txt") if l.strip()]
          cfg = open(".config", encoding="utf-8", errors="replace").read()
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())
          got = {norm(m) for m in
                 re.findall(r"^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_(\S+)=y$", cfg, re.M)}
          wset = {norm(w): w for w in want}
          lost = [w for k, w in wset.items() if k not in got]
          print("预期 %d 台，.config 实际选中 %d 台" % (len(wset), len(got & set(wset))))
          if lost:
              head = " ".join(lost[:15]) + (" ..." if len(lost) > 15 else "")
              print("::warning::被 kconfig 丢弃 %d 台: %s" % (len(lost), head))
              mp = [l.strip() for l in cfg.splitlines() if "MULTI_PROFILE" in l]
              print("MULTI_PROFILE 状态: %s" % (mp or "（.config 里没有该符号）"))
              sys.exit(1)
          for p in ("luci", "luci-app-store", "istoreos-files"):
              flag = "CONFIG_PACKAGE_%s=y" % p
              print(("OK   " if flag in cfg else "WARN ") + flag)
          mp = [l.strip() for l in cfg.splitlines() if "MULTI_PROFILE" in l]
          print("多机型模式: %s" % (mp or "（未启用）"))
          PY

          mkdir -p tmp
          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"

            # 1) defconfig 前置：主机检查 + 元数据扫描
            if ! make -j1 prepare-tmpinfo > prepare.log 2>&1; then
              tail -40 prepare.log
              echo "::endgroup::"
              echo "::error::prepare-tmpinfo 失败（主机依赖缺失或 package 元数据有错），见上方日志"
              exit 1
            fi
            grep -E "Please install|Build dependency|Failed to build" prepare.log | head -10 || true

            # 2) 用权威元数据生成 .config 种子
            python3 gen_config.py

            # 3) defconfig —— kconfig 遇递归依赖时仍会写出 .config 并 exit 0，只能事后复核
            if ! make -j1 defconfig > defconfig.log 2>&1; then
              tail -40 defconfig.log
              echo "::endgroup::"
              echo "::error::make defconfig 执行失败"
              exit 1
            fi

            # 4) 复核台数
            vrc=0
            python3 verify_config.py || vrc=$?

            if [ "$vrc" = "0" ]; then
              ok=1
              echo "::endgroup::"
              break
            fi

            # 5) feed 的 Kconfig 递归依赖：禁用问题包后重试
            if grep -q "recursive dependency detected" defconfig.log; then
              echo "::warning::检测到 Kconfig 递归依赖（feed 元数据 bug），禁用问题包后重试"
              grep -A2 "recursive dependency detected" defconfig.log | head -8 || true
              bad=$(grep -oE "symbol PACKAGE_[A-Za-z0-9_.+-]+ depends on PACKAGE_" defconfig.log \
                    | sed -E 's/^symbol PACKAGE_([^ ]+) .*/\1/' | sort -u)
              echo "问题包: ${bad:-（未解析出包名）}"
              changed=0
              for p in $bad; do
                if echo " $PROTECTED " | grep -q " $p "; then
                  echo "::error::$p 属于必需包，不能自动禁用，请手工修 feed"
                  echo "::endgroup::"
                  exit 1
                fi
                while IFS= read -r d; do
                  [ -z "$d" ] && continue
                  if [ -f "$d/Makefile" ]; then
                    mv "$d/Makefile" "$d/Makefile.disabled"
                    echo "已禁用: $d"
                    changed=1
                  fi
                done < <(find feeds package/feeds -maxdepth 3 -type d -name "$p" 2>/dev/null || true)
              done
              echo "::endgroup::"
              if [ "$changed" = "1" ]; then
                rm -f tmp/.packageinfo tmp/.config-package.in
                continue
              fi
              echo "::error::检测到递归依赖但没定位到包目录，见 defconfig.log"
              exit 1
            fi

            # 6) 其它原因：一次性打印全部诊断信息
            echo "::error::.config 校验未通过，且 defconfig 没有递归依赖报错"
            echo "===== .config 前 25 行 ====="
            head -25 .config || true
            echo "===== MULTI_PROFILE / ALL_PROFILES ====="
            grep -n "MULTI_PROFILE\|TARGET_ALL_PROFILES" .config || echo "（无）"
            echo "===== 元数据里的 Target Devices 菜单 ====="
            grep -n -A3 'menu "Target Devices"' tmp/.config-target.in | head -8 \
              || echo "（元数据里没有该菜单）"
            echo "===== defconfig.log 尾部 ====="
            tail -30 defconfig.log || true
            echo "::endgroup::"
            exit 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::尝试 3 次仍未得到有效 .config"
            exit 1
          fi
      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          nproc
          # OpenWrt 官方建议比核数多 1 个并发
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log

      - name: 失败诊断
        if: failure()
        run: |
          for f in prepare.log defconfig.log feeds-update.log feeds-install.log build.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.group }}
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验每台机型的产物
        run: |
          mkdir -p out
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img.gz' -o -name '*.ubi' \
               -o -name '*.trx' -o -name '*.tar.gz' -o -name 'sha256sums' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          miss=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if ls out/ 2>/dev/null | grep -qF -- "$d"; then
              echo "  ✔ $d"
            else
              echo "::warning::$d 已选中但没找到产物（可能该机型只出 initramfs 或打包被跳过）"
              miss=$((miss+1))
            fi
          done < wanted.txt
          echo "产物文件数: $(ls out | wc -l)，缺失机型: $miss"

          {
            echo "## 🏗️ ${{ matrix.group }} 编译完成"
            echo ""
            echo "- 机型: ${{ matrix.count }} 台，产物文件: $(ls out | wc -l) 个"
            echo "- 缺失: $miss 台"
            echo ""
            echo "| 机型 | 文件 |"
            echo "|---|---|"
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              f=$(ls out 2>/dev/null | grep -F -- "$d" | head -8 | tr '\n' '<br>')
              echo "| $d | ${f:-—} |"
            done < wanted.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.group }}
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 3：发布到 Release
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [prepare, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: rel
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true
          echo "文件总数: $(ls -1 | wc -l)"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="istoreos-${{ env.VERSION }}-mt798x-$(date -u +%Y%m%d)-r${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          iStoreOS ${{ env.VERSION }} 自动编译（MT7981 / MT7986 / MT7988）

          - 触发方式: ${{ github.event_name }}
          - 版本: ${{ env.VERSION }}（源码 ${{ env.SRC_REPO }} 分支 ${{ env.SRC_REF }}，commit ${{ needs.prepare.outputs.src_sha }}）
          - 机型数: ${{ needs.prepare.outputs.total }} 台
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          刷机前请确认机型后缀：
          - \`-stock\` = 原厂分区布局
          - \`-ubootmod\` = 已刷 ubootmod 引导的设备
          刷错变体会变砖，务必核对。
          EOF
          gh release create "$TAG" rel/* \
            --title "iStoreOS MT798x · ${{ env.VERSION }} · $TAG" \
            --notes-file notes.md \
            --latest
