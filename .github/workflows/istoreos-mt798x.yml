name: 🍞 iStoreOS MT798x Build (7981/7986)

# 每周三 08:00 (北京时间) 自动编译 = UTC 周三 00:00
on:
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      groups:
        description: '1、编译哪些芯片'
        required: false
        default: 'BOTH'
        type: choice
        options:
          - 'BOTH'
          - 'MT7981'
          - 'MT7986'
      mode:
        description: '2、机型范围（精选=社区常用已适配机型；全量=该芯片全部机型）'
        required: false
        default: 'curated'
        type: choice
        options:
          - 'curated'
          - 'all'
          - 'custom'
      devices:
        description: '3、自定义机型（mode=custom 时生效，空格/逗号分隔，如 cmcc_rax3000m cudy_tr3000-v1）'
        required: false
        default: ''
      exclude:
        description: '4、排除机型（空格分隔，如 xiaomi_mi-router-ax3000t-ubootmod）'
        required: false
        default: ''
      packages:
        description: '5、额外固件包（空格分隔，默认已含 luci + iStore）'
        required: false
        default: 'luci luci-compat luci-i18n-base-zh-cn luci-app-store'
      make_release:
        description: '6、是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: istoreos-mt798x-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 1：解析机型清单（按 DEVICE_DTS 判定 MT7981 / MT7986）
  # ============================================================
  prepare:
    name: 🧭 机型清单
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Checkout (仅取 filogic.mk)
        uses: actions/checkout@v5
        with:
          sparse-checkout: target/linux/mediatek/image/filogic.mk
          sparse-checkout-cone-mode: false

      - name: 解析并生成清单
        id: plan
        env:
          GROUPS: ${{ inputs.groups || 'BOTH' }}
          MODE: ${{ inputs.mode || 'curated' }}
          CUSTOM: ${{ inputs.devices || '' }}
          EXCLUDE: ${{ inputs.exclude || '' }}
        run: |
          python3 - <<'PY'
          import os, re, json

          MK = "target/linux/mediatek/image/filogic.mk"
          lines = open(MK, encoding="utf-8", errors="replace").read().splitlines()

          # ---- 1. 收集 define Device/xxx ... endef 块 ----
          blocks, cur, buf = {}, None, []
          for line in lines:
              m = re.match(r"\s*define\s+Device/([A-Za-z0-9_.\-]+)\s*$", line)
              if m:
                  cur, buf = m.group(1), []
                  continue
              if cur and re.match(r"\s*endef\s*$", line):
                  blocks[cur] = buf
                  cur = None
                  continue
              if cur is not None:
                  buf.append(line)

          def resolve(name, depth=0, seen=None):
              """沿父模板链取 DEVICE_DTS（纯继承设备也不会漏）"""
              seen = seen or set()
              if name in seen or depth > 8 or name not in blocks:
                  return None
              seen.add(name)
              dts = parent = None
              for line in blocks[name]:
                  mm = re.search(r"DEVICE_DTS\s*:?=\s*\"?([A-Za-z0-9_./\-]+)\"?", line)
                  if mm and not dts:
                      dts = mm.group(1)
                  mp = re.search(r"\$\(call\s+Device/([A-Za-z0-9_.\-]+)\)", line)
                  if mp and not parent:
                      parent = mp.group(1)
              if not dts and parent:
                  dts = resolve(parent, depth + 1, seen)
              return dts

          # ---- 2. 设备全集取 TARGET_DEVICES，避免把模板当设备 ----
          targets = set()
          for line in lines:
              if "TARGET_DEVICES" in line and "+=" in line:
                  for tok in re.split(r"[\s\\]+", line.split("+=", 1)[1]):
                      tok = tok.strip()
                      if tok and re.fullmatch(r"[A-Za-z0-9_.\-]+", tok):
                          targets.add(tok)

          groups = {"MT7981": [], "MT7986": [], "OTHER": []}
          for d in sorted(targets):
              dts = resolve(d)
              if dts and dts.lower().startswith("mt7981"):
                  groups["MT7981"].append(d)
              elif dts and dts.lower().startswith("mt7986"):
                  groups["MT7986"].append(d)
              else:
                  groups["OTHER"].append(d)

          print("机型总数: %d (MT7981=%d MT7986=%d OTHER=%d)" %
                (len(targets), len(groups["MT7981"]), len(groups["MT7986"]), len(groups["OTHER"])))

          # ---- 3. 精选清单（社区常用、上游已适配的机型，出错面最小）----
          CURATED = {
              "MT7981": """cmcc_rax3000m cmcc_a10-stock cudy_tr3000-v1 cudy_tr3000-256mb-v1
                           cudy_m3000-v1 glinet_gl-mt3000 jcg_q30-pro xiaomi_mi-router-ax3000t
                           xiaomi_mi-router-wr30u-stock qihoo_360t7 h3c_magic-nx30-pro netis_nx30v2
                           zbtlink_zbt-z8103ax huasifei_wh3000-pro-nand imou_hx21 nokia_ea0326gmp""".split(),
              "MT7986": """glinet_gl-mt6000 xiaomi_redmi-router-ax6000-stock netcore_n60 netcore_n60-pro
                           jdcloud_re-cp-03 asus_tuf-ax4200 tplink_tl-xdr6088 tplink_tl-xdr6086
                           bananapi_bpi-r3 bananapi_bpi-r3-mini jiorouter_ax6000-jidu6101 asiarf_ap7986-003""".split(),
          }

          mode = os.environ.get("MODE", "curated").strip() or "curated"
          exclude = set(os.environ.get("EXCLUDE", "").replace(",", " ").split())
          want_groups = os.environ.get("GROUPS", "BOTH").strip() or "BOTH"
          if want_groups == "BOTH":
              want_groups = ["MT7981", "MT7986"]
          else:
              want_groups = [want_groups]

          custom = [x for x in re.split(r"[\s,]+", os.environ.get("CUSTOM", "").strip()) if x]

          os.makedirs("plan", exist_ok=True)
          matrix, unknown, rows = [], [], []

          for g in ["MT7981", "MT7986"]:
              if g not in want_groups:
                  continue
              if mode == "all":
                  sel = groups[g]
              elif mode == "custom":
                  # 自定义列表里不属于本芯片的机型自动过滤
                  sel = [d for d in custom if d in groups[g]]
                  unknown += [d for d in custom if d not in groups["MT7981"] + groups["MT7986"]]
              else:
                  sel = [d for d in CURATED[g] if d in groups[g]]
                  lost = [d for d in CURATED[g] if d not in groups[g]]
                  if lost:
                      print("::warning::精选清单中这些机型在本源码树里不存在，已跳过: %s" % " ".join(lost))

              sel = [d for d in sel if d not in exclude]
              if not sel:
                  print("::warning::%s 没有可编译机型，跳过该组" % g)
                  continue

              fname = "%s.txt" % g.lower()
              with open(os.path.join("plan", fname), "w") as f:
                  f.write("\n".join(sel) + "\n")
              matrix.append({"group": g, "count": len(sel), "file": fname})
              rows.append((g, len(sel), sel))

          if unknown:
              print("::warning::自定义清单里这些机型不存在，已忽略: %s" % " ".join(sorted(set(unknown))))

          total = sum(m["count"] for m in matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=%s\n" % json.dumps(matrix, separators=(",", ":")))
              f.write("total=%d\n" % total)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 🧭 机型清单（模式: %s）\n\n" % mode)
              f.write("| 芯片 | 台数 | 机型 |\n|---|---|---|\n")
              for g, n, sel in rows:
                  f.write("| %s | %d | %s |\n" % (g, n, "<br>".join(sel)))
              f.write("\n源码树可用机型：MT7981 %d 台 / MT7986 %d 台\n" %
                      (len(groups["MT7981"]), len(groups["MT7986"])))
          PY

      - name: 上传清单
        uses: actions/upload-artifact@v4
        with:
          name: device-plan
          path: plan/
          retention-days: 3

  # ============================================================
  # Job 2：按芯片分组编译（每组一次内核编译，产出该组全部机型）
  # ============================================================
  build:
    name: 🏗️ ${{ matrix.group }} (${{ matrix.count }} 台)
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget ccache zstd

      - name: 下载清单
        uses: actions/download-artifact@v4
        with:
          name: device-plan
          path: plan

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.group }}-
            ccache-

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi

          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      - name: 生成 .config 并逐台校验选中状态
        env:
          DEVICE_FILE: plan/${{ matrix.file }}
          PACKAGES: ${{ inputs.packages || 'luci luci-compat luci-i18n-base-zh-cn luci-app-store' }}
        run: |
          # 1) 先只选 target/subtarget，让 kconfig 自己生成该 subtarget 的机型符号表
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF
          make defconfig >/dev/null 2>&1

          # 2) 用生成的符号表反查机型 -> 符号，避免手写符号名写错被静默丢弃
          python3 - <<'PY'
          import os, re, sys
          want = [l.strip() for l in open(os.environ["DEVICE_FILE"])
                  if l.strip() and not l.startswith("#")]
          txt = open(".config").read()
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())

          syms = {}
          for m in re.finditer(
              r"^(?:# )?(CONFIG_TARGET_DEVICE_[A-Za-z0-9_]+_DEVICE_(\S+?))(?: is not set|=y)$",
              txt, re.M):
              syms[norm(m.group(2))] = m.group(1)
          print("kconfig 中可用机型符号: %d 个" % len(syms))

          picked, missing = [], []
          for d in want:
              s = syms.get(norm(d))
              (picked.append(s) if s else missing.append(d))
          if missing:
              print("::error::这些机型在 kconfig 里找不到对应符号（源码树可能变了）: %s"
                    % " ".join(missing))
              sys.exit(1)

          keep = set(picked)
          out = []
          for line in txt.splitlines():
              if re.match(r"^(?:# )?CONFIG_TARGET_DEVICE_.*_DEVICE_\S+(?: is not set|=y)$", line):
                  sym = line.split("=")[0].replace("# ", "").replace(" is not set", "")
                  if sym not in keep:
                      continue
              out.append(line)
          out += ["%s=y" % s for s in picked]

          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]
          out += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]
          open(".config", "w").write("\n".join(out) + "\n")
          open("wanted.txt", "w").write("\n".join(want) + "\n")
          print("已写入 %d 台机型 + %d 个额外包" % (len(picked), len(pkgs)))
          PY

          make defconfig >/dev/null 2>&1

          # 3) 复核：预期台数 vs 实际选中台数，差集必须为空
          python3 - <<'PY'
          import os, re, subprocess, sys
          want = [l.strip() for l in open("wanted.txt") if l.strip()]
          cfg = open(".config").read()
          got = set()
          for m in re.finditer(r"^CONFIG_TARGET_DEVICE_[A-Za-z0-9_]+_DEVICE_(\S+)=y$", cfg, re.M):
              got.add(re.sub(r"[^a-z0-9]", "_", m.group(1).lower()))
          wset = {re.sub(r"[^a-z0-9]", "_", w.lower()): w for w in want}
          lost = [w for k, w in wset.items() if k not in got]
          print("预期 %d 台，实际选中 %d 台" % (len(wset), len(got & set(wset))))
          if lost:
              print("::error::被静默丢弃的机型: %s" % " ".join(lost))
              sys.exit(1)
          # 关键包是否真的进去
          for p in ("luci", "istoreos-files"):
              flag = "CONFIG_PACKAGE_%s=y" % p
              print(("OK   " if flag in cfg else "WARN ") + flag)
          PY

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          nproc
          # OpenWrt 官方建议比核数多 1 个并发
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log

      - name: 失败诊断
        if: failure()
        run: |
          echo "===== 错误摘要 ====="
          grep -nE "^make(\[[0-9]+\])?: \*\*\*|Error [0-9]+$|error:" build.log | tail -40 || true
          echo "===== 日志尾部 ====="
          tail -80 build.log || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.group }}
          path: build.log
          retention-days: 7

      - name: 校验每台机型的产物
        run: |
          mkdir -p out
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img.gz' -o -name '*.ubi' \
               -o -name '*.trx' -o -name '*.tar.gz' -o -name 'sha256sums' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          miss=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if ls out/ 2>/dev/null | grep -qF -- "$d"; then
              echo "  ✔ $d"
            else
              echo "::warning::$d 已选中但没找到产物（可能该机型只出 initramfs 或打包被跳过）"
              miss=$((miss+1))
            fi
          done < wanted.txt
          echo "产物文件数: $(ls out | wc -l)，缺失机型: $miss"

          {
            echo "## 🏗️ ${{ matrix.group }} 编译完成"
            echo ""
            echo "- 机型: ${{ matrix.count }} 台，产物文件: $(ls out | wc -l) 个"
            echo "- 缺失: $miss 台"
            echo ""
            echo "| 机型 | 文件 |"
            echo "|---|---|"
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              f=$(ls out 2>/dev/null | grep -F -- "$d" | head -8 | tr '\n' '<br>')
              echo "| $d | ${f:-—} |"
            done < wanted.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.group }}
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 3：发布到 Release
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [prepare, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: rel
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true
          echo "文件总数: $(ls -1 | wc -l)"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="istoreos-mt798x-$(date -u +%Y%m%d)-r${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          iStoreOS ${{ github.ref_name }} 自动编译（MT7981 / MT7986）

          - 触发方式: ${{ github.event_name }}
          - 机型数: ${{ needs.prepare.outputs.total }} 台
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          刷机前请确认机型后缀：
          - \`-stock\` = 原厂分区布局
          - \`-ubootmod\` = 已刷 ubootmod 引导的设备
          刷错变体会变砖，务必核对。
          EOF
          gh release create "$TAG" rel/* \
            --title "iStoreOS MT798x · $TAG" \
            --notes-file notes.md \
            --latest
