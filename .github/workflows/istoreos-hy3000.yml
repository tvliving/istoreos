#=====================================================================================
# Build iStoreOS (tvliving/istoreos) for Philips HY3000 (MT7981B / eMMC) — 25.12
#=====================================================================================
# 单设备独立编译：philips_hy3000（飞利浦 HY3000，MT7981B + MT7531 + 2.5G 上行）
# 设备支持（DTS / filogic.mk / 02_network / platform.sh）已移植进本仓库 istoreos-25.12：
#   - 参考 tvliving/immortalwrt-mt798x-action 的 hy3000（padavanonly openwrt-24.10-6.6）
#   - 与原版差异：istoreos-25.12（内核 6.12）的 mt7981b.dtsi 中 wifi 节点默认 disabled，
#     且 WiFi 走 mt76（kmod-mt7915e）而非 MTK mt_wifi——
#     DTS 已显式启用 &wifi 并接 eMMC factory 分区 eeprom(nvmem)，
#     workflow 同时显式选入全部 WiFi 驱动/固件包，保证 LuCI“网络→无线”菜单正常出现
# 注意：必须克隆 tvliving/istoreos（设备支持在 fork 里），不能克隆上游 istoreos/istoreos
# Release 标签 istoreos-hy3000-2512-YYYYMMDD，只创建不删除
#=====================================================================================

name: 🍞 iStoreOS Philips HY3000 Build (25.12)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '额外固件包（空格分隔，默认已含 luci + iStore + WiFi 全套驱动）'
        required: false
        default: 'luci luci-compat luci-i18n-base-zh-cn luci-app-store kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-basic-mbedtls wireless-regdb iwinfo'
      make_release:
        description: '是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: istoreos-hy3000-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVICE: philips_hy3000
  REPO_URL: https://github.com/tvliving/istoreos
  REPO_BRANCH: istoreos-25.12
  VERSION: 25.12

jobs:
  build:
    name: 🏗️ HY3000 (25.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true
          git config --global user.name "GitHub Actions" && git config --global user.email "actions@github.com"

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hy3000-2512-${{ github.sha }}
          restore-keys: |
            ccache-hy3000-2512-
            ccache-

      - name: 克隆源码（tvliving/istoreos istoreos-25.12，含 HY3000 设备支持）
        run: |
          df -hT $PWD
          git clone --depth 1 ${REPO_URL} -b ${REPO_BRANCH} istoreos
          cd istoreos
          echo "================= 最新提交 ================="
          git log -1 --format="commit: %H  date: %ci"
          echo "================= 确认 HY3000 设备支持 ================="
          grep -q "define Device/philips_hy3000" target/linux/mediatek/image/filogic.mk \
            || { echo "::error::filogic.mk 中没有 philips_hy3000，请确认设备支持已提交"; exit 1; }
          test -f target/linux/mediatek/dts/mt7981b-philips-hy3000.dts || {
            echo "::error::缺少 HY3000 dts"; exit 1; }
          grep -q '&wifi' target/linux/mediatek/dts/mt7981b-philips-hy3000.dts \
            || { echo "::error::HY3000 dts 未启用 &wifi（会导致没有无线）"; exit 1; }
          echo "✔ 设备定义 / dts / wifi 启用 全部就绪"

      - name: 更新 feeds（带重试与逐条诊断）
        working-directory: istoreos
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::feeds update 连续 3 次失败"; exit 1; }

          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::feeds install 失败"; exit 1; }

      - name: 生成 .config（HY3000 + WiFi 驱动全量选入）
        working-directory: istoreos
        env:
          PACKAGES: ${{ inputs.packages || 'luci luci-compat luci-i18n-base-zh-cn luci-app-store kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-basic-mbedtls wireless-regdb iwinfo' }}
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y"
            for p in $PACKAGES; do echo "CONFIG_PACKAGE_${p}=y"; done
          } > .config
          make defconfig

          echo ">>> 已选设备："
          grep "CONFIG_TARGET_DEVICE" .config
          echo ">>> WiFi 相关包复核（缺任何一个都会导致 LuCI 无无线，直接失败）："
          missing=0
          for p in kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-basic-mbedtls wireless-regdb; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "OK   CONFIG_PACKAGE_${p}=y"
            else
              echo "::error::CONFIG_PACKAGE_${p} 未选中，WiFi 将不可用"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || { grep -E "CONFIG_PACKAGE_(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo|wpad|wireless)" .config; exit 1; }

      - name: 预下载软件包
        working-directory: istoreos
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译
        working-directory: istoreos
        run: |
          set -o pipefail
          nproc
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败，用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              make -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  target/linux|package/*)
                    echo "===== V=s 复现 $p ====="
                    make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  *) echo "未知失败目标 $p，跳过 V=s";;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: 失败诊断
        if: failure()
        working-directory: istoreos
        run: |
          for f in feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-hy3000-2512
          path: |
            istoreos/*.log
            istoreos/.config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验产物
        working-directory: istoreos
        run: |
          mkdir -p out
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*philips*hy3000*sysupgrade.itb' \
               -o -name '*philips*hy3000*gpt.bin' \
               -o -name '*philips*hy3000*preloader.bin' \
               -o -name '*philips*hy3000*bl31-uboot.fip' \
               -o -name 'sha256sums' -o -name 'profiles.json' \
               -o -name '*.buildinfo' -o -name '*.manifest' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          # recovery（initramfs）一并保留：U-Boot 菜单 TFTP 引导 / 网页刷机用
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*philips*hy3000*recovery.itb' \
            -exec cp {} out/ \; 2>/dev/null || true

          if ! ls out/ 2>/dev/null | grep -qE "philips.*hy3000.*sysupgrade.itb"; then
            echo "::error::$DEVICE 没有找到 sysupgrade.itb 产物"
            ls -la out/ bin/targets/mediatek/filogic/ 2>/dev/null || true
            exit 1
          fi
          for a in gpt.bin preloader.bin bl31-uboot.fip; do
            ls out/ | grep -q "philips.*hy3000.*$a" || { echo "::error::缺少引导工件 $a"; exit 1; }
          done
          echo "产物文件数: $(ls out | wc -l)"
          {
            echo "## 🏗️ iStoreOS 25.12 · Philips HY3000 编译完成"
            echo ""
            echo "- 产物文件: $(ls out | wc -l) 个"
            echo "- WiFi: mt76（kmod-mt7915e）+ wpad，LuCI 网络→无线可用"
            echo ""
            echo "| 文件 |"
            echo "|---|"
            ls out | while read -r f; do echo "| $f |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-hy3000-2512
          path: istoreos/out/
          retention-days: 14
          if-no-files-found: error

  release:
    name: 📦 发布 Release
    needs: build
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-hy3000-2512
          path: rel

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true

      - name: 创建 Release（istoreos-hy3000-2512-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="istoreos-hy3000-2512-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          iStoreOS 25.12（源码 tvliving/istoreos istoreos-25.12 分支，设备支持已移植）自动编译

          - 触发方式: ${{ github.event_name }}
          - 机型: philips_hy3000（飞利浦 HY3000，MT7981B + MT7531，eMMC）
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          WiFi：mt76（kmod-mt7915e）+ wpad，2.4G/5G 双频（iStoreOS 默认关闭无线，
          进 LuCI 网络→无线手动启用即可）。注意 iStoreOS 默认账户 root / 密码空。

          本固件为 FIT(itb) 镜像，配套社区 bl-mt798x U-Boot（eMMC GPT 布局）：
          - preloader.bin  → BL2，写 eMMC boot0 硬件分区（mmc partconf 0 1 1 1）
          - bl31-uboot.fip → 写用户区 0x3400 扇区（U-Boot FIP）
          - gpt.bin        → 写用户区扇区 0（GPT 分区表）
          - sysupgrade.itb → production 分区系统镜像（U-Boot 网页/菜单刷入）
          - initramfs-recovery.itb → 临时救援/恢复镜像（U-Boot 菜单 TFTP 引导）
          在已装社区 U-Boot 的机器上：U-Boot 网页刷 sysupgrade.itb 即可；
          原厂/安卓系统需先按 rax3000m 流程刷入 bl2+fip+gpt 三引导工件。
          EOF
          gh release create "$TAG" rel/* \
            --title "iStoreOS HY3000 (25.12) · $TAG" \
            --notes-file notes.md \
            --latest
